<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Chicken CRE atlas</title><style>body{margin:0;background:#111d28;color:#e5f0f8;min-height:100vh;display:grid;place-items:center;font:16px/1.6 system-ui}main{max-width:540px;margin:24px;padding:28px;background:#1a2b3c;border:1px solid #37566f;border-radius:12px}h1{font-size:28px}a{color:#87ccff}small{color:#a3bed1}</style></head><body><main><h1>Chicken CRE atlas</h1><p id="state">Connecting to the protected atlas…</p><p><a id="open" hidden>Open atlas</a></p><small>This permanent entry point connects to the current HTTPS viewer. An access password is required. Research data are read-only.</small></main><script>const state=document.getElementById('state'),link=document.getElementById('open');fetch('url.json?v='+Math.floor(Date.now()/30000),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('The current viewer address is unavailable. Please retry shortly.');return r.json();}).then(d=>{if(d.ready===false)throw Error(d.message||'The atlas viewer is reconnecting. Please retry shortly.');const url=new URL(d.url);if(url.protocol!=='https:'||!['.trycloudflare.com','.lhr.life','.localhost.run'].some(s=>url.hostname.endsWith(s)))throw Error('Viewer address did not pass validation.');let target=new URLSearchParams(location.search).get('target')||'/';if(!target.startsWith('/')||target.startsWith('//')||target.includes('\\')||/[\r\n]/.test(target))target='/';const result=new URL(target,url);if(result.origin!==url.origin)throw Error('Invalid atlas target.');link.href=result.href;link.hidden=false;state.textContent='Opening the protected atlas…';location.replace(result.href);}).catch(e=>{state.textContent=e.message;});</script></body></html>
